# Camera input. Depth must already be aligned to the color image.
color_topic: /camera_d435_0/color/image_raw
depth_topic: /camera_d435_0/aligned_depth_to_color/image_raw
camera_info_topic: /camera_d435_0/color/camera_info
camera_frame: camera_d435_0_color_optical_frame
depth_scale: 0.001
sync_queue_size: 8
sync_slop: 0.05

# Empty selects the bundled default model (1020.onnx); launch may override it.
model_path: ""
input_size: 640
onnx_threads: 8
confidence_threshold: 0.30
iou_threshold: 0.01
class_names: [light, knob, bolt, nut, valve, pump, button, door_button, air_switch, board_card]

# Absolute panel ID layout (left to right):
#   0 button/green, 1 button/red, 2 knob/black,
#   3 knob/red, 4 button/red, 5 button/red, 6 button/green.
# A complete view seeds the position cache; partial views are matched as a
# contiguous class/colour window and then disambiguated by cached positions.
registry_stable_frames: 15
registry_match_distance_px: 80.0
registry_green_hue_range: [35, 85]
registry_color_minimum_ratio: 0.15
# Empty uses the full seven-target layout. A wrist camera dedicated to a
# physical subset can override this (the dual-arm launch uses [5, 6] on right).
registry_target_ids: []

# Panel-row axis handling.  The defaults are derived per node and are normally
# left unset:
#   button_axis_bootstrap  defaults to 1 when registry_target_ids is not empty.
#                          The right wrist only sees the ID5/ID6 buttons, so it
#                          has no knob to anchor the row and must fit the row
#                          from its own detections.  Leave unset.
#   publish_panel_axis     the full-panel detector publishes its fitted row
#                          direction on panel_axis_topic (latched, default 1).
#   panel_axis_topic       shared row-direction topic, default /panel/panel_axis.
#   external_panel_axis    a restricted detector may adopt the shared direction
#                          (default 0).  Only valid when both wrist cameras have
#                          the same image orientation; the local bootstrap above
#                          is preferred.

# Panel-row extraction. Two visible knobs bootstrap the axis; afterwards its
# direction is cached so that a translated/narrow camera view still works.
panel_line_initial_dist_ratio: 1.1
panel_line_dist_ratio: 0.85
panel_line_min_dist_px: 45.0
panel_line_max_dist_px: 110.0
panel_line_proj_margin_ratio: 3.0
panel_line_min_projection_margin_px: 450.0

# Same eye-in-hand position stabilizer used by ROS2. During camera motion it
# publishes the current measurement; temporal smoothing begins only after the
# target has remained at nearly the same pixel for the configured time.
position_stabilizer:
  enable: true
  still_time: 3.0
  pixel_thresh: 5.0
  window_size: 45
  ema_alpha: 0.25
  depth_std_thresh: 0.01

# ROS2-compatible angle modes:
#   1: stable 0/90 output; ID 4 uses the red long-handle detector and the
#      other configured IDs use the white marker line detector.
#   2: red knob uses red-handle/white-tape detection constrained to 180..270;
#      other knobs use white-tape detection constrained to 0..90.
#   3: the same red-handle/white-tape detection without angle constraints.
knob_angle:
  enable: true
  binary_thresh: 180
  circle_mask_ratio: 0.85
  use_constraint: 1
  # ROS2 behavior: only detections whose class is exactly "knob" have an
  # angle. ID4 is a normal button; IDs2/3 are knobs.
  knob_class: knob
  discrete_switch_margin: 8.0
  discrete_confirm_frames: 3

# Outputs may be namespaced independently for the left and right arm.
targets_topic: /panel/targets
status_topic: /panel/status
distance_topic: /panel/distance
knob_angle_topic: /panel/knob_angles
button_topic: /panel/buttons
debug_image_topic: /panel/debug_image
publish_debug_image: true

# Physical panel tags on this robot are ArUco 6x6, not AprilTag 36h11.
# Keep the validation-site ID mapping (T02/T03 knobs, T00/T01/T04/T05/T06
# buttons, T07 board card).
panel_apriltag:
  scene: validation_site
  dictionary: [DICT_6X6_250, DICT_APRILTAG_36h11]
  enable: true

# Tag-relative board-card refinement.  T07 supplies a scale-normalised slot
# frame; the black card's full outer silhouette is measured in colour and
# checked against the panel depth.  Production has only two stable states:
# `empty` (white base + blue backplane) and `inserted` (black card fully
# seated).  Insertion motion is out of scope.  No fixed tag-relative card top,
# length or slot anchor is used: the tag may be mounted with a different offset
# on another panel.  `position` is the measured outer-card centre (inserted) or
# the measured blue-backplane slot centre on the panel plane (empty).
board_card_localizer:
  enable: true
  tag_id: 7
  # Fixed tag-relative ROI: x right, y down, one unit = one tag side.
  roi_x: [-3.5, 3.5]
  roi_y: [1.0, 11.0]
  roi_size: [560, 800]
  # Broad central band: legacy strip state check and blue-backplane search.
  slot_x: [0.36, 0.64]
  slot_y: [0.16, 0.99]
  dark_v_max: 105
  dark_s_max: 165
  min_visible_rows: 30
  min_width_px: 70
  max_width_px: 150
  min_confidence: 0.30
  # Full outer-card silhouette.  The black body is darker and less saturated
  # than the blue backplane; nearby fragments split by the card's white label
  # are merged only when they are also in front of the panel.
  card_dark_v_max: 70
  card_dark_s_max: 100
  card_min_area_px: 5000
  card_min_width_px: 50
  card_max_width_px: 260
  card_candidate_max_width_px: 520
  card_trim_margin_px: 12
  card_min_length_px: 180
  card_min_fill_ratio: 0.45
  card_merge_gap_px: 28
  card_merge_min_area_px: 300
  card_merge_min_height_px: 40
  card_merge_min_overlap: 0.40
  card_protrusion_min_m: 0.015
  card_component_min_protrusion_fraction: 0.45
  card_min_protrusion_pixels: 500
  card_outer_min_confidence: 0.35
  card_outer_min_black_fraction: 0.55
  # Card-front depth plane; panel plane is fallback only.
  card_depth_min_points: 80
  card_depth_max_rms_m: 0.010
  card_depth_gate_m: 0.08
  card_plane_inlier_m: 0.006
  card_plane_min_inliers: 150
  # A fully inserted card extends at least this far down the ROI.  A short
  # dark blob near the bottom of an empty recess is rejected.  This is a state
  # gate, not a position prior.
  min_inserted_length_tag: 3.8
  # Reject the empty slot's blue backplane/connector and recess shadow: the
  # black card body must occupy most of the fitted polygon.
  min_black_fraction: 0.50
  # Robust tag-relative pose lock.  No absolute tag-relative position prior.
  pose_lock_frames: 5
  pose_lock_max_mad_tag: 0.30
  plane_depth_gate_m: 0.12
  # Empty-slot centre is measured from the blue backplane; no fixed
  # tag-relative slot anchor is used.
  slot_blue_h: [80, 138]
  slot_blue_s_min: 70
  slot_blue_v_min: 18
  slot_min_blue_area: 300
  slot_min_blue_height: 80
  slot_max_blue_width: 180
  # Binary state confirmation.  Insertion motion is ignored.
  inserted_confirm_frames: 3
  empty_confirm_frames: 5
  smooth_alpha: 0.35
  max_anchor_jump_px: 35.0
  tag_cache_frames: 12
  # Panel plane fit around T07 (metres).
  panel_plane_radius_tag: 1.2
  panel_plane_min_points: 60
  panel_plane_min_inliers: 600
  panel_z_range_m: [0.15, 1.20]
  # Fallback only; inserted cards use the measured card-front plane.
  panel_depth_offset_m: 0.0
  plane_hold_frames: 15
  depth_min_m: 0.05
  depth_max_m: 2.0
  plane_inlier_m: 0.004
  plane_iterations: 80
  plane_min_points: 40
  # Final stillness-gated 3D position lock.
  still_frames: 5
  still_pixel_thresh: 2.0
  still_window: 15

